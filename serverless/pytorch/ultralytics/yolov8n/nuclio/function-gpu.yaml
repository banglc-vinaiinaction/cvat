metadata:
  name: pth-ultralytics-yolov8n-bdd100k
  namespace: cvat
  annotations:
    name: YOLOv8n Pre-labeler (BDD100K Mapped - GPU)
    type: detector
    spec: |
      [
        { "id": 0, "name": "pedestrian", "type": "rectangle" },
        { "id": 1, "name": "rider", "type": "rectangle" },
        { "id": 2, "name": "car", "type": "rectangle" },
        { "id": 3, "name": "truck", "type": "rectangle" },
        { "id": 4, "name": "bus", "type": "rectangle" },
        { "id": 5, "name": "train", "type": "rectangle" },
        { "id": 6, "name": "motorcycle", "type": "rectangle" },
        { "id": 7, "name": "bicycle", "type": "rectangle" },
        { "id": 8, "name": "traffic light", "type": "rectangle" },
        { "id": 9, "name": "traffic sign", "type": "rectangle" }
      ]

spec:
  description: Ultralytics YOLOv8n Pre-labeling Detector mapped to BDD100K 10 classes (GPU, conf=0.25)
  runtime: 'python:3.12'
  handler: main:handler
  eventTimeout: 60s
  env:
    - name: PYTHONPATH
      value: /opt/nuclio
    - name: MODEL_WEIGHTS
      value: /weights/yolov8n.pt
    - name: YOLO_CONFIG_DIR
      value: /tmp/Ultralytics
    - name: TORCH_DEVICE
      value: cuda

  volumes:
    - volume:
        name: weights
        hostPath:
          path: /media/bang/Work/projects/P-004/data/model_qc_v2/weights
      volumeMount:
        name: weights
        mountPath: /weights

  build:
    image: cvat.pth.ultralytics.yolov8n-bdd100k:latest-gpu
    baseImage: nhattruong19052005/cvat-yolo-server:latest

    directives:
      preCopy:
        - kind: USER
          value: root
        - kind: ENTRYPOINT
          value: '[]'
        - kind: WORKDIR
          value: /opt/nuclio

  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 20000
      attributes:
        maxRequestBodySize: 33554432

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: bind
